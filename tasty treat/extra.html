<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Treat Homepage</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden !important;
        }

        /* ===== HEADER ===== */
        .top-header .row {
            display: flex;
            align-items: center;
        }

        .top-header-row {
            padding: 15px 0;
        }

        .main-logo {
            height: 50px;
            width: auto;
            display: block;
        }

        .search-box {
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-input {
            height: 45px;
            border-radius: 0;
        }

        .search-btn {
            border: none;
            background: red;
            height: 45px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-icon {
            height: 18px;
            filter: invert(1);
        }

        .search-side-logo {
            display: flex;
            align-items: center;
            margin-left: 10px;
        }

        .outlet-logo,
        .review-logo {
            height: 50px;
            width: auto;
            display: block;
        }

        .right-section a {
            text-decoration: none;
            color: #000;
            font-weight: 600;
        }

        .right-section .icon-logo {
            height: 28px;
            width: auto;
            display: block;
        }

        .account-link span {
            font-size: 12px;
            margin-top: 3px;
        }

        .phone {
            text-decoration: none;
            color: #000;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ===== NAVIGATION ===== */
        .top-menu-grid {
            width: 100%;
            background-color: #fe0000;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 999;
        }

        .ty-menu__items {
            list-style: none;
            margin: 0;
            padding: 0 150px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .ty-menu__item {
            position: relative;
            margin-right: 20px;
        }

        .ty-menu__item a.ty-menu__item-link {
            text-decoration: none;
            color: #ffffff;
            padding: 10px 5px;
            display: inline-block;
            transition: color 0.2s;
        }

        .ty-menu__item:hover > a.ty-menu__item-link {
            color: #000;
        }

        .ty-menu__item:hover {
            background-color: #a30000;
        }

        .ty-menu__submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #fff;
            border: 1px solid #ddd;
            min-width: 180px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .ty-menu__submenu-item a:hover {
            background-color: #f2f2f2;
            color: #d50000;
        }

        .ty-menu__item:hover .ty-menu__submenu {
            display: block;
        }

        @media (max-width: 768px) {
            .ty-menu__items {
                flex-direction: column;
                display: none;
            }
        }

        /* ===== SLIDER ===== */
        .full-width-slider {
            width: 100vw;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .full-width-slider .item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .owl-theme .owl-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .owl-theme .owl-dots .owl-dot span {
            width: 12px;
            height: 12px;
            background: #ccc;
            display: inline-block;
            border-radius: 50%;
            margin: 0 5px;
        }

        .owl-theme .owl-dots .owl-dot.active span {
            background: #d50000;
        }

        /* ===== FREE HOME DELIVERY BANNER ===== */
        .free-home-banner img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container-fluid top-header">
            <div class="row align-items-center top-header-row g-0">
                <div class="col-3 d-flex justify-content-center align-items-start">
                    <a href="#"><img src="https://tastytreatbd.com/images/logos/16/T.T-Logo-400X160-pix.jpg"
                            class="main-logo"></a>
                </div>
                <div class="col-6">
                    <div class="d-flex align-items-center">
                        <form class="d-flex search-box">
                            <input type="search" class="form-control search-input" placeholder="Search products">
                            <button class="search-btn"><img
                                    src="https://cdn-icons-png.flaticon.com/512/54/54481.png" class="search-icon">
                            </button>
                        </form>
                        <div class="d-flex align-items-center ms-3 search-side-logo">
                            <a href="#"><img
                                    src="https://edailyshopping.com/images/storefronts/tastytreat/topmenu_outlet.jpg"
                                    class="outlet-logo"></a>
                            <a href="#" class="ms-2"><img
                                    src="https://edailyshopping.com/images/storefronts/tastytreat/Review-or-feedback-60x60-3.jpg"
                                    class="review-logo"></a>
                        </div>
                    </div>
                </div>
                <div class="col-3 d-flex justify-content-center align-items-center">
                    <div class="d-flex align-items-center gap-3 right-section">
                        <a href="#" class="phone">09613-451-451</a>
                        <a href="#" class="account-link d-flex flex-column align-items-center text-center"><img
                                src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" class="icon-logo"><span>Account</span></a>
                        <a href="#" class="d-flex align-items-center gap-1"><img
                                src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" class="icon-logo"></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="top-menu-grid">
            <ul class="ty-menu__items cm-responsive-menu">
                <li class="ty-menu__item"><a href="#" class="ty-menu__item-link">Ramadan Special</a></li>
                <li class="ty-menu__item"><a href="#" class="ty-menu__item-link">Cakes & Pastry</a></li>
                <li class="ty-menu__item"><a href="#" class="ty-menu__item-link">Snacks & Savory</a></li>
                <li class="ty-menu__item"><a href="#" class="ty-menu__item-link">Cookies & Bread</a></li>
            </ul>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- SLIDER -->
        <div id="banner_slider" class="owl-carousel owl-theme full-width-slider">
            <div class="item"><img
                    src="https://tastytreatbd.com/images/promo/177/Online-Cake-offer-Web-Banner-2543X450.jpg"
                    alt="Online Cake Offer"></div>
            <div class="item"><img
                    src="https://tastytreatbd.com/images/promo/177/Online-Custom-Cake-2543X450__1_.jpg"
                    alt="Online Custom Cake"></div>
        </div>

        <!-- FREE HOME DELIVERY BANNER -->
        <div class="free-home-banner">
            <img src="https://tastytreatbd.com/images/promo/176/Free-Home-Delivery-on-300tk-Order_01.png"
                alt="Free Home Delivery">
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
            $('#banner_slider').owlCarousel({
                items: 1,
                loop: true,
                autoplay: true,
                autoplayTimeout: 500,
                autoplayHoverPause: true,
                dots: true,
                nav: false,
                smartSpeed: 1000,
                autoHeight: true
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Demo</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body{
            background-color: #888;
        }
        /* =================== Card Container =================== */
        .card {
            width: 260px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            margin: 20px;
            display: flex;
            flex-direction: column;
        }

        /* =================== Image Section =================== */
        .card-image {
            position: relative;
            max-height: 270px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            display: block;
            transition: transform 0.3s;
        }

        

        /* =================== Top-right Hover Icons =================== */
        .card-icons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .card-image:hover .card-icons {
            opacity: 1;
        }

        .card-icons a {
            background: rgba(0,0,0,0.6);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s;
        }

        .card-icons a:hover {
            background: #ff6600;
        }

        /* =================== Label =================== */
        .card-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff6600;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 6px;
            border-radius: 3px;
        }

        /* =================== Footer =================== */
        .card-footer {
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px 12px;
            min-height: 160px;
            position: relative;
            flex-direction: row;
            gap: 10px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        /* Title full width */
        .card-title {
            font-size: 14px;
            font-weight: bold;
            width: 100%;
        }

        .card-title a {
            color: #333;
            text-decoration: none;
        }

        .card-title a:hover {
            color: #ff6600;
        }

        /* Stock info with tick */
        .card-stock {
            font-size: 12px;
            color: #28a745;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-stock i {
            color: #28a745;
        }

        /* Price section: old price on top */
        .card-price {
            display: flex;
            flex-direction: column;
            
            margin-top: auto;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            font-size: 12px;
        }

        .current-price {
            font-weight: bold;
            color: #ff6600;
        }

        /* =================== Add-to-cart + qty =================== */
        .add-to-cart-wrapper {
            display: flex;
            justify-content: end;
            
            position: relative;
            padding-top: 80px;

        }

        /* Cart button bottom-right */
        .add-to-cart {
            background: #d20202;
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .add-to-cart:hover {
            background: #ba0c0c;
            transform: scale(1.1);
        }

        /* Quantity appears left of cart */
        .card-qty {
            display: flex;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
            transition: all 0.3s ease;
            background: #fff;
            border: 1px solid #ddd;
            padding: 5px;
            border-radius: 50px;
        }

        .add-to-cart-wrapper:hover .card-qty {
            opacity: 1;
            pointer-events: auto;
            
        }

        .card-qty button {
            background: #f5f5f5;
            border: none;
            padding: 0px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        .card-qty button:hover {
            background: #ddd;
        }

        .card-qty input {
            width: 20px;
            text-align: center;
            border: 1px solid #ddd;
            
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-image">
        <a href="#">
            <img src="https://tastytreatbd.com/images/thumbnails/270/270/detailed/165/Copy_of_Maroon_And_Orange_Modern_Combo_Burger_Instagram_Post__1_.jpg.png" alt="Nutella Waffle 110gm">
        </a>

        <span class="card-label">Save 15%</span>

        <div class="card-icons">
            <a href="#"><i class="fas fa-eye"></i></a>
            <a href="#"><i class="fas fa-heart"></i></a>
            <a href="#"><i class="fas fa-chart-bar"></i></a>
        </div>
    </div>

    <div class="card-footer">
        <div class="card-info">
            <h3 class="card-title"><a href="#">Nutella Waffle 110gm</a></h3>
            <div class="card-stock"><i class="fas fa-check-circle"></i> In stock</div>

            
        </div>

        <div class="add-to-cart-wrapper">
            <div class="card-price">
                <span class="old-price">৳150.00</span>
                <span class="current-price">৳127.50</span>
            </div>
            <div class="card-qty">
                <button class="qty-decrease">−</button>
                <input type="text" value="1" min="1">
                <button class="qty-increase">+</button>
            </div>
            <button class="add-to-cart"><i class="fas fa-shopping-cart"></i></button>
        </div>
    </div>
</div>

</body>
</html>
